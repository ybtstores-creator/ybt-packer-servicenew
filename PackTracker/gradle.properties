# Project-wide Gradle settings.
# The wrapper downloads once; all artifacts resolve from the local machine first.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# The app does not use Jetifier (no legacy support libraries).
android.enableJetifier=false
# Use the machine's JDK for toolchains where possible.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
# Non-transitive R classes speeds up builds; single module project.
android.nonTransitiveRClass=true
